<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethical Hacking Academy | n4jwvn</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500&family=Inter:wght@300;400;600;700&display=swap');

        :root {
            --neon-green: #22c55e;
            --cyber-bg: #020617;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--cyber-bg);
        }

        .font-mono {
            font-family: 'Fira Code', monospace;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #334155; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-green); 
        }

        /* Glow Animations */
        .glow-text {
            text-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
        }

        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
        .scanline {
            position: absolute;
            width: 100%;
            height: 2px;
            background: rgba(34, 197, 94, 0.1);
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        .fade-in {
            animation: fadeIn 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glitch effect for titles */
        .glitch-hover:hover {
            animation: glitch 0.3s cubic-bezier(.25,.46,.45,.94) both infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
    </style>
</head>
<body class="text-slate-300 h-screen flex overflow-hidden selection:bg-green-500/30">

    <!-- Mobile Overlay -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/90 z-40 hidden backdrop-blur-md" onclick="toggleMobileMenu()"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-72 bg-[#020617] border-r border-slate-800/60 transform -translate-x-full md:translate-x-0 transition-transform duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] flex flex-col h-full shadow-2xl">
        <div class="p-8 border-b border-slate-800/60">
            <div class="flex items-center gap-3 text-green-500 mb-2">
                <div class="p-2 bg-green-500/10 rounded-lg">
                    <i data-lucide="terminal" class="w-6 h-6"></i>
                </div>
                <span class="font-bold tracking-tighter text-xl text-white">N4JWVN<span class="text-green-500">.EDU</span></span>
            </div>
            <p class="text-[10px] text-slate-500 font-mono pl-1 tracking-widest uppercase">System Auth: Verified</p>
        </div>

        <div id="sidebar-nav" class="flex-1 overflow-y-auto py-6 px-4 space-y-2">
            <!-- Sidebar items injected by JS -->
        </div>

        <div class="p-6 border-t border-slate-800/60 space-y-4">
            <!-- Instagram Link -->
            <a href="https://www.instagram.com/n4jwvn/" target="_blank" class="flex items-center gap-3 p-3 rounded-xl bg-gradient-to-r from-purple-500/10 to-pink-500/10 border border-purple-500/20 hover:border-pink-500/50 transition-all group">
                <div class="p-2 bg-pink-500/20 rounded-lg text-pink-500 group-hover:scale-110 transition-transform">
                    <i data-lucide="instagram" class="w-5 h-5"></i>
                </div>
                <div>
                    <p class="text-xs font-bold text-white leading-none">@n4jwvn</p>
                    <p class="text-[10px] text-slate-500 mt-1">Follow for Updates</p>
                </div>
            </a>

            <div class="bg-slate-950/50 rounded-xl p-4 border border-slate-800/60">
                <div class="flex items-center gap-2 mb-2 text-yellow-500">
                    <i data-lucide="shield-alert" class="w-4 h-4"></i>
                    <span class="text-[10px] font-bold uppercase tracking-widest">Protocol</span>
                </div>
                <p class="text-[10px] text-slate-500 leading-relaxed italic">
                    Strictly for educational research. Misuse of tools is prohibited under cyber-law.
                </p>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full min-w-0 relative bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')]">
        <div class="scanline"></div>
        
        <!-- Top Nav -->
        <header class="flex items-center justify-between px-6 py-4 border-b border-slate-800/40 bg-slate-950/40 backdrop-blur-xl z-30">
            <div class="flex items-center gap-4">
                <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-slate-400 hover:text-white bg-slate-900 rounded-lg">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <div class="hidden md:flex items-center gap-2 text-xs font-mono">
                    <span class="text-slate-600">PATH:</span>
                    <span class="text-slate-400">~/academy/</span>
                    <span id="breadcrumb-id" class="text-green-500 font-bold">home</span>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-2">
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                    <span class="text-[10px] font-mono text-slate-500 uppercase tracking-tighter">Server: Online</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <div id="main-scroll" class="flex-1 overflow-y-auto p-6 md:p-12 lg:p-16 scroll-smooth">
            <div id="content-wrapper" class="max-w-5xl mx-auto">
                <!-- Content will be injected here -->
            </div>
            
            <footer class="mt-24 pt-12 border-t border-slate-800/60 text-center space-y-4">
                <div class="flex justify-center gap-8 opacity-40">
                    <i data-lucide="github" class="w-5 h-5 cursor-pointer hover:text-white transition-colors"></i>
                    <i data-lucide="twitter" class="w-5 h-5 cursor-pointer hover:text-white transition-colors"></i>
                    <i data-lucide="command" class="w-5 h-5 cursor-pointer hover:text-white transition-colors"></i>
                </div>
                <p class="text-[10px] font-mono tracking-widest text-slate-600">
                    &copy; MMXXIV N4JWVN ACADEMY // ENCRYPTED SESSION
                </p>
            </footer>
        </div>
    </main>

    <script>
        // --- DATA ---
        const curriculum = [
            {
                id: 'home',
                title: 'System Access',
                icon: 'home',
                color: 'text-white',
                isHome: true,
                content: {
                    heading: "Welcome to N4JWVN Academy",
                    description: "Select a module from the terminal sidebar to begin your journey into the art of offensive security.",
                    sections: []
                }
            },
            {
                id: 'intro',
                title: 'Ethics & Laws',
                icon: 'shield-check',
                color: 'text-blue-400',
                content: {
                    heading: "The Ethical Matrix",
                    description: "Before you learn to break systems, you must learn the code of conduct that keeps you out of prison.",
                    sections: [
                        {
                            title: "The Ethical Hacker's Creed",
                            text: "Ethical hacking is the practice of testing systems with full authorization. Without a contract, it's a crime.",
                            points: [
                                { label: "Permission", desc: "Never touch a system without written consent." },
                                { label: "Privacy", desc: "Respect the data you encounter during a pentest." },
                                { label: "Reporting", desc: "Document every flaw and provide remediation steps." }
                            ]
                        }
                    ]
                }
            },
            {
                id: 'recon',
                title: 'Reconnaissance',
                icon: 'eye',
                color: 'text-emerald-400',
                content: {
                    heading: "Information Gathering",
                    description: "80% of a successful hack is done before the first exploit is even considered.",
                    sections: [
                        {
                            title: "OSINT (Open Source Intelligence)",
                            text: "Finding what the target doesn't know they've exposed.",
                            tools: ["Shodan", "Whois", "Google Dorks", "TheHarvester"]
                        },
                        {
                            title: "Interactive: Google Dorking",
                            type: "dork_sim"
                        }
                    ]
                }
            },
            {
                id: 'scanning',
                title: 'Network Scanning',
                icon: 'activity',
                color: 'text-purple-400',
                content: {
                    heading: "Scanning & Enumeration",
                    description: "Mapping the network to find live hosts and open services.",
                    sections: [
                        {
                            title: "Port Discovery",
                            text: "Identifying entry points using Nmap.",
                            type: "nmap_sim"
                        }
                    ]
                }
            },
            {
                id: 'web',
                title: 'Web Exploitation',
                icon: 'globe',
                color: 'text-pink-400',
                content: {
                    heading: "Web App Hacking",
                    description: "Attacking the application layer where most vulnerabilities reside today.",
                    sections: [
                        {
                            title: "OWASP Top 10",
                            points: [
                                { label: "Broken Access Control", desc: "Accessing files you shouldn't." },
                                { label: "Cryptographic Failures", desc: "Weak SSL or unhashed passwords." },
                                { label: "Injection", desc: "SQLi or Command Injection attacks." }
                            ]
                        }
                    ]
                }
            },
            {
                id: 'passwords',
                title: 'Password Cracking',
                icon: 'key',
                color: 'text-red-400',
                content: {
                    heading: "Cracking & Auth",
                    description: "Learning how hashes are cracked and how to defend against brute-force.",
                    sections: [
                        {
                            title: "Entropy Check",
                            type: "password_sim"
                        }
                    ]
                }
            }
        ];

        let activeModuleId = 'home';
        let isMobileMenuOpen = false;

        function renderSidebar() {
            const container = document.getElementById('sidebar-nav');
            container.innerHTML = curriculum.map(mod => {
                const isActive = mod.id === activeModuleId;
                const activeClasses = isActive 
                    ? 'bg-green-500/10 border-l-2 border-green-500 text-white shadow-[0_0_20px_rgba(34,197,94,0.1)]' 
                    : 'text-slate-500 hover:bg-slate-900 hover:text-slate-200';
                
                return `
                    <button onclick="setActiveModule('${mod.id}')" 
                        class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-300 group ${activeClasses}">
                        <div class="transition-colors ${isActive ? mod.color : 'text-slate-600 group-hover:text-slate-400'}">
                            <i data-lucide="${mod.icon}" class="w-5 h-5"></i>
                        </div>
                        <span class="font-bold text-xs uppercase tracking-widest text-left">${mod.title}</span>
                    </button>
                `;
            }).join('');
            lucide.createIcons();
        }

        function renderHome() {
            return `
                <div class="fade-in text-center py-10 md:py-20">
                    <div class="inline-block p-4 bg-green-500/10 rounded-3xl border border-green-500/20 mb-8">
                        <i data-lucide="terminal" class="w-16 h-16 text-green-500 glow-text"></i>
                    </div>
                    <h1 class="text-4xl md:text-7xl font-black text-white mb-6 tracking-tighter glitch-hover">
                        N4JWVN <span class="text-green-500 underline decoration-green-500/30 underline-offset-8">ACADEMY</span>
                    </h1>
                    <p class="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed mb-12">
                        Advanced ethical hacking resources, network security simulations, and offensive research tools for the modern security professional.
                    </p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl mx-auto">
                        <div class="p-6 bg-slate-900/40 border border-slate-800/60 rounded-2xl hover:border-green-500/40 transition-all cursor-pointer group" onclick="setActiveModule('intro')">
                            <i data-lucide="book" class="w-8 h-8 text-green-500 mb-4 group-hover:scale-110 transition-transform"></i>
                            <h3 class="text-white font-bold mb-2">Learn</h3>
                            <p class="text-xs text-slate-500">Structured modules on modern cyber threats.</p>
                        </div>
                        <div class="p-6 bg-slate-900/40 border border-slate-800/60 rounded-2xl hover:border-blue-500/40 transition-all cursor-pointer group" onclick="setActiveModule('scanning')">
                            <i data-lucide="cpu" class="w-8 h-8 text-blue-500 mb-4 group-hover:scale-110 transition-transform"></i>
                            <h3 class="text-white font-bold mb-2">Simulate</h3>
                            <p class="text-xs text-slate-500">Interactive tools to practice command execution.</p>
                        </div>
                        <div class="p-6 bg-slate-900/40 border border-slate-800/60 rounded-2xl hover:border-purple-500/40 transition-all cursor-pointer group" onclick="setActiveModule('recon')">
                            <i data-lucide="zap" class="w-8 h-8 text-purple-500 mb-4 group-hover:scale-110 transition-transform"></i>
                            <h3 class="text-white font-bold mb-2">Exploit</h3>
                            <p class="text-xs text-slate-500">Understand the logic of common vulnerabilities.</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderModule(module) {
            let html = `
                <div class="fade-in space-y-12">
                    <div class="border-b border-slate-800/60 pb-10">
                        <div class="flex items-center gap-3 mb-6">
                            <span class="px-3 py-1 bg-green-500/10 text-green-500 text-[10px] font-mono rounded-full border border-green-500/20">MODULE_0${curriculum.indexOf(module)}</span>
                        </div>
                        <h1 class="text-4xl md:text-5xl font-black text-white mb-4 tracking-tight">${module.content.heading}</h1>
                        <p class="text-slate-400 text-lg max-w-3xl">${module.content.description}</p>
                    </div>
                    
                    <div class="grid grid-cols-1 gap-12">
            `;

            module.content.sections.forEach(section => {
                html += `
                    <div class="bg-slate-900/20 rounded-3xl p-8 border border-slate-800/40 hover:border-slate-700/60 transition-colors">
                        <h2 class="text-2xl font-bold text-white mb-6 flex items-center gap-3">
                            <span class="w-2 h-8 bg-green-500 rounded-full"></span>
                            ${section.title}
                        </h2>
                `;

                if (section.text) {
                    html += `<p class="text-slate-400 mb-6 leading-relaxed">${section.text}</p>`;
                }

                if (section.points) {
                    html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">';
                    section.points.forEach(pt => {
                        html += `
                            <div class="p-4 bg-slate-950/50 rounded-xl border border-slate-800/40">
                                <span class="block text-green-500 font-bold text-sm mb-1">${pt.label}</span>
                                <span class="text-slate-400 text-xs">${pt.desc}</span>
                            </div>
                        `;
                    });
                    html += '</div>';
                }

                if (section.tools) {
                    html += `
                        <div class="flex flex-wrap gap-3 mb-6">
                            ${section.tools.map(tool => `<span class="px-4 py-2 bg-slate-950 text-slate-300 font-mono text-xs rounded-lg border border-slate-800">${tool}</span>`).join('')}
                        </div>
                    `;
                }

                if (section.type === 'nmap_sim') html += getNmapSimHTML();
                if (section.type === 'dork_sim') html += getDorkSimHTML();
                if (section.type === 'password_sim') html += getPasswordSimHTML();

                html += `</div>`;
            });

            html += `</div></div>`;
            return html;
        }

        function renderContent() {
            const module = curriculum.find(m => m.id === activeModuleId);
            const container = document.getElementById('content-wrapper');
            document.getElementById('breadcrumb-id').innerText = module.id;

            if (module.isHome) {
                container.innerHTML = renderHome();
            } else {
                container.innerHTML = renderModule(module);
            }

            lucide.createIcons();
            attachNmapListeners();
            attachDorkListeners();
            attachPasswordListeners();
        }

        // --- SIMULATOR COMPONENTS ---
        function getNmapSimHTML() {
            return `
                <div class="space-y-4 font-mono">
                    <div class="flex flex-wrap gap-4 p-4 bg-slate-950 rounded-2xl border border-slate-800">
                        <select id="nmap-flags" class="bg-slate-900 text-green-500 p-2 rounded border border-slate-800 outline-none text-xs">
                            <option value="-sS">Stealth (SYN)</option>
                            <option value="-sV">Service Detection</option>
                            <option value="-A">Aggressive Scan</option>
                        </select>
                        <input id="nmap-target" type="text" value="10.0.0.1" class="bg-slate-900 text-white p-2 rounded border border-slate-800 outline-none text-xs flex-1">
                        <button id="nmap-run-btn" class="bg-green-600 hover:bg-green-500 text-white px-6 py-2 rounded-lg text-xs font-bold transition-all">EXECUTE</button>
                    </div>
                    <div id="nmap-console" class="h-48 bg-black/80 rounded-2xl p-4 text-[11px] text-green-500/80 overflow-y-auto border border-green-500/10">
                        <span class="opacity-40 tracking-widest">$ Waiting for input...</span>
                    </div>
                </div>
            `;
        }

        function getDorkSimHTML() {
            return `
                <div class="space-y-4">
                    <div class="flex gap-2 overflow-x-auto pb-2 scroll-hide">
                        <button class="dork-btn px-3 py-1 bg-slate-950 border border-slate-800 rounded-lg text-[10px] text-slate-400 hover:border-green-500" data-val="site:gov.it filetype:sql">SQL Leaks</button>
                        <button class="dork-btn px-3 py-1 bg-slate-950 border border-slate-800 rounded-lg text-[10px] text-slate-400 hover:border-green-500" data-val="inurl:admin login">Login Pages</button>
                        <button class="dork-btn px-3 py-1 bg-slate-950 border border-slate-800 rounded-lg text-[10px] text-slate-400 hover:border-green-500" data-val='intitle:"index of" "backup"'>Backup Dirs</button>
                    </div>
                    <input id="dork-input" type="text" class="w-full bg-slate-950 p-4 rounded-2xl border border-slate-800 outline-none font-mono text-sm text-green-500" value="site:target.com ext:pdf">
                </div>
            `;
        }

        function getPasswordSimHTML() {
            return `
                <div class="bg-slate-950 p-6 rounded-2xl border border-slate-800">
                    <input id="pass-input" type="password" placeholder="Test password strength..." class="w-full bg-slate-900 p-4 rounded-xl border border-slate-800 outline-none mb-4 font-mono text-white">
                    <div class="flex justify-between text-[10px] font-bold uppercase tracking-widest mb-2">
                        <span id="pass-strength-text" class="text-slate-500">Security: Void</span>
                        <span id="pass-time-text" class="text-slate-500">Time: Null</span>
                    </div>
                    <div class="h-1.5 w-full bg-slate-900 rounded-full overflow-hidden">
                        <div id="pass-bar" class="h-full bg-slate-700 transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            `;
        }

        // --- HANDLERS ---
        function attachNmapListeners() {
            const btn = document.getElementById('nmap-run-btn');
            if(!btn) return;
            btn.onclick = () => {
                const consoleDiv = document.getElementById('nmap-console');
                const target = document.getElementById('nmap-target').value;
                const flags = document.getElementById('nmap-flags').value;
                btn.disabled = true;
                consoleDiv.innerHTML = `<span class="animate-pulse font-bold">[!] Initializing probe on ${target}...</span>`;
                setTimeout(() => {
                    consoleDiv.innerHTML = `
                        Nmap scan report for ${target}<br>
                        Host is up (0.0042s latency).<br>
                        Not shown: 998 closed ports<br>
                        PORT     STATE SERVICE<br>
                        22/tcp   open  ssh<br>
                        80/tcp   open  http<br>
                        443/tcp  open  https<br><br>
                        <span class="text-white font-bold">Scan complete. 1 IP address scanned.</span>
                    `;
                    btn.disabled = false;
                }, 1500);
            };
        }

        function attachDorkListeners() {
            document.querySelectorAll('.dork-btn').forEach(b => {
                b.onclick = () => document.getElementById('dork-input').value = b.dataset.val;
            });
        }

        function attachPasswordListeners() {
            const input = document.getElementById('pass-input');
            if(!input) return;
            input.onkeyup = (e) => {
                const p = e.target.value;
                let score = 0;
                if(p.length > 6) score++;
                if(p.length > 10) score++;
                if(/[A-Z]/.test(p)) score++;
                if(/[0-9]/.test(p)) score++;
                if(/[^A-Za-z0-9]/.test(p)) score++;

                const bar = document.getElementById('pass-bar');
                const strength = document.getElementById('pass-strength-text');
                const time = document.getElementById('pass-time-text');

                const colors = ['bg-red-500', 'bg-orange-500', 'bg-yellow-500', 'bg-blue-500', 'bg-green-500', 'bg-emerald-400'];
                const labels = ['Critical', 'Low', 'Medium', 'Good', 'Secure', 'Encryption Grade'];
                const crack = ['Instantly', 'Minutes', 'Days', 'Years', 'Centuries', 'Eons'];

                bar.className = `h-full transition-all duration-500 ${colors[score]}`;
                bar.style.width = `${(score/5)*100}%`;
                strength.innerText = `Security: ${labels[score]}`;
                strength.className = score > 3 ? 'text-green-500' : 'text-slate-500';
                time.innerText = `Time: ${crack[score]}`;
            };
        }

        function setActiveModule(id) {
            activeModuleId = id;
            renderSidebar();
            renderContent();
            if (window.innerWidth < 768 && isMobileMenuOpen) toggleMobileMenu();
            document.getElementById('main-scroll').scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileMenu() {
            isMobileMenuOpen = !isMobileMenuOpen;
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderSidebar();
            renderContent();
        });
    </script>
</body>
</html>
